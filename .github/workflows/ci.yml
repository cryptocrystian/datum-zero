name: CI

on:
  push:
  pull_request:

jobs:
  # Layer 2 enforcement — the manifest-compliance suite must pass on every change.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Manifest compliance guardrails (CR-12, CR-02, governance)
        run: pytest tests/guardrails -q

  schema:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `prisma validate` can resolve the datasource env() refs (no DB connection).
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@localhost:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@localhost:5432/datum_zero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Prisma schema
        working-directory: packages/db
        run: npx --yes prisma@latest validate --schema prisma/schema.prisma
      - name: Validate work-order JSON contract
        run: |
          npx --yes ajv-cli@5 compile -s packages/adapters/contracts/work-order.schema.json \
          || node -e "JSON.parse(require('fs').readFileSync('packages/adapters/contracts/work-order.schema.json'));console.log('contract is valid JSON')"

  web:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `prisma generate` can resolve the datasource env() refs (no DB connection).
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@localhost:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@localhost:5432/datum_zero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        # @dz/web typechecks against @dz/db, which imports the generated Prisma client.
        run: pnpm --filter @dz/db exec prisma generate
      - name: Typecheck web
        run: pnpm --filter @dz/web typecheck
      - name: Lint web
        run: pnpm --filter @dz/web lint
      - name: Unit tests (vitest)
        run: pnpm --filter @dz/web test

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inference service
        working-directory: services/inference
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Test inference service
        working-directory: services/inference
        run: pytest -q

  # End-to-end walking-skeleton DoD path (M0-12) against real Postgres + Redis.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dz
          POSTGRES_PASSWORD: dz_local_dev
          POSTGRES_DB: datum_zero
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U dz -d datum_zero"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      # Runtime (app + worker + e2e) connects as the RLS-subject app role; migrations/seed use dz.
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@localhost:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@localhost:5432/datum_zero
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma migrate deploy + generate
        # migrate deploy runs as dz via directUrl and CREATES datumzero_app + RLS; generate builds the client.
        run: |
          pnpm --filter @dz/db exec prisma migrate deploy
          pnpm --filter @dz/db exec prisma generate
      - name: Seed concierge tenant
        run: pnpm db:seed
      - name: E2E — DoD walking-skeleton path
        run: pnpm --filter @dz/web test:e2e
