name: CI

on:
  push:
  pull_request:

jobs:
  # Layer 2 enforcement — the manifest-compliance suite must pass on every change.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - name: Manifest compliance guardrails (CR-12, CR-02, governance)
        run: pytest tests/guardrails -q

  schema:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `prisma validate` can resolve the datasource env() refs (no DB connection).
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@localhost:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@localhost:5432/datum_zero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Prisma schema
        working-directory: packages/db
        # Pin to the project's Prisma major (package.json: prisma ^6.1.0). `prisma@latest` is now v7,
        # which dropped the `datasource url`/`directUrl` properties this schema (and the RLS dual-role,
        # CR-20) relies on — a validator-version drift, not a schema error.
        run: npx --yes prisma@6 validate --schema prisma/schema.prisma
      - name: Validate work-order JSON contract
        run: |
          npx --yes ajv-cli@5 compile -s packages/adapters/contracts/work-order.schema.json \
          || node -e "JSON.parse(require('fs').readFileSync('packages/adapters/contracts/work-order.schema.json'));console.log('contract is valid JSON')"

  web:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `prisma generate` can resolve the datasource env() refs (no DB connection).
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@localhost:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@localhost:5432/datum_zero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        # @dz/web typechecks against @dz/db, which imports the generated Prisma client.
        run: pnpm --filter @dz/db exec prisma generate
      - name: Typecheck web
        run: pnpm --filter @dz/web typecheck
      - name: Lint web
        run: pnpm --filter @dz/web lint
      - name: Unit tests (vitest)
        run: pnpm --filter @dz/web test

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inference service
        working-directory: services/inference
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest jsonschema
      - name: Test inference service
        working-directory: services/inference
        run: pytest -q

  # End-to-end walking-skeleton DoD path (M0-12) against real Postgres + Redis.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dz
          POSTGRES_PASSWORD: dz_local_dev
          POSTGRES_DB: datum_zero
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U dz -d datum_zero"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      # Runtime (app + worker + e2e) connects as the RLS-subject app role; migrations/seed use dz.
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@localhost:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@localhost:5432/datum_zero
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma migrate deploy + generate
        # migrate deploy runs as dz via directUrl and CREATES datumzero_app + RLS; generate builds the client.
        run: |
          pnpm --filter @dz/db exec prisma migrate deploy
          pnpm --filter @dz/db exec prisma generate
      - name: Seed concierge tenant
        run: pnpm db:seed
      - name: E2E — DoD walking-skeleton path
        run: pnpm --filter @dz/web test:e2e

  # M2-6b (CR-35) — build + validate the container images on a Docker-native runner (Docker ships on
  # ubuntu-* runners), then prove the composed stack is production-parity. Makes CR-35's image ACs a
  # PERMANENT gate rather than the host-side proxies M2-6a could run. Do not build Terraform (M2-6c)
  # on images this job hasn't proven.
  images:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@localhost:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@localhost:5432/datum_zero
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # --- Step 1: build all three images (buildx + GHA layer cache), loaded into the local daemon ---
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: web
          tags: dz-web:local
          load: true
          cache-from: type=gha,scope=webimg
          cache-to: type=gha,mode=max,scope=webimg
      - name: Build workers image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: workers
          tags: dz-workers:local
          load: true
          cache-from: type=gha,scope=webimg
          cache-to: type=gha,mode=max,scope=webimg
      - name: Build inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/inference/Dockerfile
          tags: dz-inference:local
          load: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,mode=max,scope=inference

      # --- Step 2: runtime assertions against the REAL images ---
      - name: Non-root (all three images)
        run: |
          set -euo pipefail
          for img in dz-web:local dz-workers:local dz-inference:local; do
            uid="$(docker run --rm "$img" id -u)"
            echo "$img -> uid $uid"
            [ "$uid" != "0" ] || { echo "::error::$img runs as root"; exit 1; }
          done
      - name: Inference boots; FLIR/TIFF serve; DJI fails closed (no SDK)
        run: docker run --rm -i dz-inference:local python - < scripts/ci/check_inference_runtime.py
      - name: Inference /health endpoint
        run: |
          set -euo pipefail
          docker run -d --name infer \
            -e S3_ENDPOINT=http://127.0.0.1:9000 -e S3_BUCKET=x -e S3_REGION=us-east-1 \
            -e S3_ACCESS_KEY_ID=x -e S3_SECRET_ACCESS_KEY=x \
            -p 8000:8000 dz-inference:local
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs infer || true
          docker rm -f infer >/dev/null
          [ "$ok" = 1 ] || { echo "::error::inference /health never passed"; exit 1; }

      # --- Step 3: REAL layer guardrails — scan actual built layers; fail the build on a violation ---
      - name: Scan image layers (no DJI SDK, no secret in any layer)
        run: |
          set -euo pipefail
          docker save dz-web:local       -o /tmp/web.tar
          docker save dz-workers:local   -o /tmp/workers.tar
          docker save dz-inference:local -o /tmp/inference.tar
          python scripts/ci/scan_image_layers.py /tmp/web.tar /tmp/workers.tar /tmp/inference.tar

      # --- Step 4: composed-stack DoD e2e (prod parity, PROVEN) — healthchecks + --wait, no sleeps ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install workspace (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Prisma generate (for the host-run DoD e2e)
        run: pnpm --filter @dz/db exec prisma generate
      - name: Compose up the parity stack + webhook sink (workers RUNNING — no in-process worker)
        # --wait only on the long-running services (the one-shot migrate + minio-init EXIT 0, which
        # `up --wait` treats as a failure; they still run as web/inference dependencies). The workers
        # container OWNS both queues — the real-trigger DoD drives everything black-box through it.
        run: docker compose --profile ci up -d --wait web workers inference sink
      - name: Real-trigger DoD against the composed stack (no simulation, no in-process worker)
        env:
          COMPOSED_WEB_URL: http://localhost:3000
          INGEST_API_TOKEN: local_dev_ingest_token
        run: pnpm --filter @dz/web test:e2e:composed
      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Compose down
        if: always()
        run: docker compose down -v

  # M2-6c / CR-37 — Terraform is AUTHOR-ONLY in CI. This job lints and type-checks the config; it
  # NEVER runs `plan` or `apply`, configures no AWS credentials, and touches no state. `init
  # -backend=false` is what makes that structural rather than a promise: it skips the S3 backend
  # entirely, so there is nothing for the job to authenticate to. Applying is the user's action
  # (real money, real resources) — see docs/DEPLOY.md.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Canonical formatting (all configs)
        run: terraform fmt -check -recursive terraform/

      - name: Validate — envs/prod
        working-directory: terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Validate — bootstrap (state backend, run once by hand)
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
