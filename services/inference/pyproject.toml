[project]
name = "dz-inference"
version = "0.0.0"
description = "Datum Zero — CV + spatial inference service (FastAPI). Detect + classify; the client adjudicates (CR-12)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "boto3>=1.34",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
