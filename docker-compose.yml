services:
  postgres:
    image: postgres:16
    container_name: dz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dz
      POSTGRES_PASSWORD: dz_local_dev
      POSTGRES_DB: datum_zero
    ports:
      - "5432:5432"
    volumes:
      - dz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dz -d datum_zero"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: dz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dz_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dz_pg:
  dz_redis:
