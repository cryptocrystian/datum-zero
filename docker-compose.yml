services:
  postgres:
    image: postgres:16
    container_name: dz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dz
      POSTGRES_PASSWORD: dz_local_dev
      POSTGRES_DB: datum_zero
    ports:
      - "5432:5432"
    volumes:
      - dz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dz -d datum_zero"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: dz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dz_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage (MANIFEST §3). MinIO is the S3-compatible local stand-in for AWS S3.
  # Credentials here are LOCAL DEV ONLY — prod uses IAM roles / AWS Secrets Manager, never these.
  minio:
    image: minio/minio:latest
    container_name: dz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - dz_minio:/data

  # One-shot init: wait for MinIO, then create the dev bucket. Exits 0 when done.
  minio-init:
    image: minio/mc:latest
    container_name: dz-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/datum-zero-dev;
      echo 'minio bucket datum-zero-dev ready';
      exit 0;
      "

volumes:
  dz_pg:
  dz_redis:
  dz_minio:
