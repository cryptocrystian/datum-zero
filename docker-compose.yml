services:
  postgres:
    image: postgres:16
    container_name: dz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dz
      POSTGRES_PASSWORD: dz_local_dev
      POSTGRES_DB: datum_zero
    ports:
      - "5432:5432"
    volumes:
      - dz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dz -d datum_zero"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: dz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dz_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage (MANIFEST §3). MinIO is the S3-compatible local stand-in for AWS S3.
  # Credentials here are LOCAL DEV ONLY — prod uses IAM roles / AWS Secrets Manager, never these.
  minio:
    image: minio/minio:latest
    container_name: dz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - dz_minio:/data

  # One-shot init: wait for MinIO, then create the dev bucket. Exits 0 when done.
  minio-init:
    image: minio/mc:latest
    container_name: dz-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/datum-zero-dev;
      echo 'minio bucket datum-zero-dev ready';
      exit 0;
      "

  # ==========================================================================
  # Application tier (M2-6a, CR-35) — prod PARITY + the on-prem deployment artifact.
  # RLS dual-role is preserved: the runtime (web/workers) connects as the NON-SUPERUSER datumzero_app;
  # migrations + seed run once as the elevated superuser (dz) via directUrl. Do NOT collapse the two.
  # Local dev credentials only — production uses IAM roles + AWS Secrets Manager, never these values.
  # ==========================================================================

  # One-shot: apply migrations (which create datumzero_app + the RLS policies) and seed, as SUPERUSER.
  # Reuses the workers image (a superset: pnpm + prisma + tsx + source) — no extra build.
  migrate:
    image: dz-workers:local
    container_name: dz-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dz:dz_local_dev@postgres:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@postgres:5432/datum_zero
    command: >
      sh -c "pnpm --filter @dz/db exec prisma migrate deploy &&
             pnpm --filter @dz/db run seed"
    restart: "no"

  web:
    image: dz-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    container_name: dz-web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Runtime connects as the NON-SUPERUSER role (RLS enforced); DIRECT is used only by migrate.
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@postgres:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@postgres:5432/datum_zero
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: local_dev_only_change_in_prod
      INFERENCE_CALLBACK_TOKEN: local_dev_callback_token
      INGEST_API_TOKEN: local_dev_ingest_token
      EMAIL_FROM: no-reply@datumzero.local
      # Email: prod defaults to SES (creds from the vault, M2-5a). Sign-in email is inert in this
      # prod-parity stack until SES_SMTP_* are provided — the DoD e2e does not sign in by email.
      STORAGE_DRIVER: s3
      S3_BUCKET: datum-zero-dev
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3000:3000"
    restart: unless-stopped

  workers:
    image: dz-workers:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: workers
    container_name: dz-workers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://datumzero_app:dz_app_local_dev@postgres:5432/datum_zero
      DIRECT_DATABASE_URL: postgresql://dz:dz_local_dev@postgres:5432/datum_zero
      REDIS_URL: redis://redis:6379
      # The inference worker HTTP-calls the inference service by container DNS (M2-7c) — without this it
      # defaults to localhost:8000 (nothing in this container) and every capture fails closed.
      INFERENCE_BASE_URL: http://inference:8000
    restart: unless-stopped

  inference:
    image: dz-inference:local
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    container_name: dz-inference
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      INFERENCE_CALLBACK_URL: http://web:3000/api/v1/inference/callback
      INFERENCE_CALLBACK_TOKEN: local_dev_callback_token
      S3_BUCKET: datum-zero-dev
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      # DJI Thermal SDK is CONFIDENTIAL and NEVER baked into the image (DJI EULA §14, CR-22). To enable
      # the DJI decoder locally, provide it at runtime from a PRIVATE path (FLIR/TIFF work without it;
      # the DJI decoder fails closed when absent). Uncomment + point at your vendored SDK:
      # DJI_THERMAL_SDK_PATH: /opt/dji-thermal-sdk
    # volumes:
    #   - ${DJI_THERMAL_SDK_HOST_PATH:?set to your private DJI SDK path}:/opt/dji-thermal-sdk:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Webhook sink for the real-trigger DoD (M2-7c) — a 200-returning HTTP recorder the containerized
  # outbox worker delivers to (proving worker→external through container DNS). CI-only (profile `ci`);
  # not part of the on-prem artifact. The delivered payload is validated from Postgres in the e2e.
  sink:
    image: mendhak/http-https-echo:31
    container_name: dz-sink
    profiles: ["ci"]
    environment:
      HTTP_PORT: "8080"
    restart: unless-stopped

volumes:
  dz_pg:
  dz_redis:
  dz_minio:
