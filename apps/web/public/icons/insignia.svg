<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Datum Zero insignia">
  <rect width="512" height="512" rx="96" fill="#121926" />
  <g transform="translate(106 106) scale(8.33)" fill="none">
    <!-- horizontal axis line — the reference datum -->
    <line x1="1.5" y1="18" x2="34.5" y2="18" stroke="#6D7278" stroke-width="1.25" />
    <!-- Zero capsule — the datum-zero glyph -->
    <rect x="11" y="4.5" width="14" height="27" rx="7" stroke="#ffffff" stroke-width="2.1" />
    <!-- benchmark chevron — surveyor's mark keyed to the axis (gold emphasis only) -->
    <path d="M13.6 27 L18 22.4 L22.4 27" stroke="#E9D700" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
